
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha - BIPAID</title>

    <link rel="stylesheet" href="esqueci.css">
</head>

<body>

    <main class="container-recuperacao">

        <section class="cartao-recuperacao">

            <div class="logo">
                BIPAID
            </div>

            <h1>Esqueceu sua senha?</h1>

            <p class="subtitulo">
                Não se preocupe! Digite seu e-mail e
                enviaremos um link para você criar uma
                nova senha.
            </p>

            <form>

                <div class="grupo-entrada">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>

                <button type="submit">
                    Recuperar senha
                </button>

            </form>

            <div class="voltar-login">

                <a href="login.html">
                    ← Voltar para o login
                </a>

            </div>

        </section>

    </main>
<script src="esqueci.js"></script>
</body>

</html>
